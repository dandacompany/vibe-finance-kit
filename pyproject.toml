[project]
name = "vibe-finance-kit"
version = "0.1.0"
description = "Read-only finance research skills and deterministic MCP validation tools"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "authlib>=1.6,<2",
  "fastmcp>=2.14,<3",
]

[project.scripts]
vibe-finance-kit = "vibe_finance_kit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_finance_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
